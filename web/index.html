<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Calculator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))}</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000}
  body{
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    color:#fff;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    display:flex;flex-direction:column;
    padding:max(env(safe-area-inset-top),10px) 12px max(env(safe-area-inset-bottom),12px);
    overscroll-behavior:none;
  }
  .screen{
    flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 8px 10px;min-height:0;
  }
  .display{
    text-align:right;font-weight:200;letter-spacing:-.02em;
    font-size:88px;line-height:1.05;
    white-space:nowrap;overflow:hidden;
    color:#fff;
    transition:font-size .08s linear;
    padding-bottom:6px;
  }
  .expr{
    text-align:right;color:#8e8e93;font-size:22px;font-weight:400;
    min-height:30px;line-height:1.3;
    white-space:nowrap;overflow:hidden;
    letter-spacing:-.01em;padding:0 3px 4px 0;
    opacity:0;transition:opacity .12s ease;
  }
  .expr:not(:empty){opacity:1}
  .keys{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    padding-bottom:2px;
  }
  button{
    -webkit-appearance:none;appearance:none;border:0;outline:0;
    font-family:inherit;font-weight:400;
    aspect-ratio:1/1;width:100%;
    border-radius:50%;
    font-size:36px;
    color:#fff;
    background:#333;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .1s ease, color .1s ease;
    padding-bottom:2px;
  }
  button.num{background:#333}
  button.fn{background:#a5a5a5;color:#000;font-size:31px}
  button.op{background:#ff9f0a;font-size:40px;font-weight:400}
  button.zero{
    grid-column:span 2;aspect-ratio:auto;align-self:stretch;
    border-radius:999px;
    justify-content:flex-start;padding-left:31px;
  }
  /* iOS press feedback */
  button.num:active{background:#595959}
  button.fn:active{background:#d9d9d9}
  button.op:active{background:#ffc46b}
  /* operator selected state */
  button.op.selected{background:#fff;color:#ff9f0a}
  button.op.selected:active{background:#f2f2f2}
  @media (max-height:720px){
    button{font-size:30px}
    button.op{font-size:34px}
    button.fn{font-size:25px}
    .keys{gap:10px}
    .display{font-size:72px}
    .expr{font-size:19px;min-height:26px}
  }
  @media (max-height:600px){
    button{font-size:25px;border-radius:44%}
    button.op{font-size:28px}
    button.fn{font-size:21px}
    .keys{gap:8px}
    .display{font-size:58px}
    .expr{font-size:17px;min-height:24px}
    .zero{padding-left:24px}
  }
  @media (min-width:520px){
    .keys,.screen{max-width:520px;margin:0 auto;width:100%}
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="expr" id="expr"></div>
    <div class="display" id="display">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-k="ac">AC</button>
    <button class="fn" data-k="sign">+/−</button>
    <button class="fn" data-k="pct">%</button>
    <button class="op" data-k="div">÷</button>

    <button class="num" data-k="7">7</button>
    <button class="num" data-k="8">8</button>
    <button class="num" data-k="9">9</button>
    <button class="op" data-k="mul">×</button>

    <button class="num" data-k="4">4</button>
    <button class="num" data-k="5">5</button>
    <button class="num" data-k="6">6</button>
    <button class="op" data-k="sub">−</button>

    <button class="num" data-k="1">1</button>
    <button class="num" data-k="2">2</button>
    <button class="num" data-k="3">3</button>
    <button class="op" data-k="add">+</button>

    <button class="num zero" data-k="0">0</button>
    <button class="num" data-k="dot">.</button>
    <button class="op" data-k="eq">=</button>
  </div>

<script>


(() => {
  const displayEl = document.getElementById('display');
  const opBtns = [...document.querySelectorAll('button.op')];
  const exprEl = document.getElementById('expr');

  const S = {
    display: '0',      // string shown / being typed
    acc: null,         // accumulator number
    op: null,          // 'add'|'sub'|'mul'|'div'
    waiting: false,    // next digit starts new number
    lastOp: null,      // for repeated =
    lastOperand: null,
    freshResult: false,// last action was =
    clearMode: false,  // AC vs C
    tokens: [],        // committed expression parts, e.g. ['8.5','+']
    eqText: null,      // expression shown after '='
    pctLabel: null,    // e.g. '10%' for the current operand
  };

  const OPS = { add:'+', sub:'−', mul:'×', div:'÷' };

  /* ---------- formatting ---------- */
  const MAX_DIGITS = 9;

  function toNumber(s){ return parseFloat(s) || 0; }

  function group(str){
    // str = plain numeric string, may have '-' and '.'
    let neg = str.startsWith('-');
    let body = neg ? str.slice(1) : str;
    let [int, dec] = body.split('.');
    int = int.replace(/^0+(?=\d)/, '') || '0';
    // add thousand separators
    int = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    let out = dec !== undefined ? int + '.' + dec : int;
    return (neg ? '−' : '') + out;
  }

  function fmt(num){
    if (!isFinite(num)) return 'Error';
    const neg = num < 0;
    let abs = Math.abs(num);
    let s;
    if (abs !== 0 && (abs >= 1e9 || abs < 1e-8)) {
      s = abs.toExponential(5).replace(/\.?0+e/, 'e').replace('e+', 'e');
      return (neg ? '−' : '') + s;
    }
    // avoid float noise
    s = String(parseFloat(abs.toPrecision(12)));
    let [int, dec] = s.split('.');
    if (int && int.length > MAX_DIGITS) {
      s = abs.toExponential(5).replace(/\.?0+e/, 'e').replace('e+', 'e');
      return (neg ? '−' : '') + s;
    }
    if (dec) s = int + '.' + dec.slice(0, 8);
    return (neg ? '−' : '') + group(s);
  }

  function displayString(){
    // typed value keeps trailing '.' and leading zeros, but grouped
    return group(S.display);
  }

  function currentOperandText(){
    if (S.pctLabel) return S.pctLabel;
    return S.freshResult ? fmt(toNumber(S.display)) : displayString();
  }

  function exprString(){
    if (S.eqText) return S.eqText;
    if (!S.tokens.length) return '';
    if (S.waiting) return S.tokens.join(' ');
    return S.tokens.join(' ') + ' ' + currentOperandText();
  }

  function render(){
    const txt = S.freshResult ? fmt(toNumber(S.display)) : displayString();
    displayEl.textContent = txt;
    exprEl.textContent = exprString();
    fitFont(txt);
    // AC / C label
    const acBtn = document.querySelector('[data-k="ac"]');
    acBtn.textContent = S.clearMode ? 'C' : 'AC';
    // operator highlight
    opBtns.forEach(b => b.classList.toggle('selected', b.dataset.k === S.op && S.waiting));
  }

  function fitFont(txt){
    const max = displayEl.parentElement.clientWidth - 4;
    let size = parseFloat(getComputedStyle(displayEl).fontSize) || 88;
    // reset to base first to measure true width
    const base = window.innerWidth < 380 ? 72 : 88;
    displayEl.style.fontSize = base + 'px';
    let s = base;
    let guard = 0;
    while (displayEl.scrollWidth > max && s > 34 && guard++ < 60) {
      s -= 3;
      displayEl.style.fontSize = s + 'px';
    }
  }

  /* ---------- actions ---------- */
  function inputDigit(d){
    S.eqText = null;
    S.pctLabel = null;
    if (S.waiting || S.freshResult) {
      S.display = d;
      S.waiting = false;
      S.freshResult = false;
    } else {
      if (countDigits(S.display) >= MAX_DIGITS) return;
      S.display = (S.display === '0') ? d : S.display + d;
    }
    S.clearMode = true;
    render();
  }

  function countDigits(s){
    return s.replace(/[-.]/g, '').replace(/^0+(?=\d)/, '').length;
  }

  function inputDot(){
    S.eqText = null;
    S.pctLabel = null;
    if (S.waiting || S.freshResult) {
      S.display = '0.';
      S.waiting = false;
      S.freshResult = false;
    } else if (!S.display.includes('.')) {
      S.display += '.';
    }
    S.clearMode = true;
    render();
  }

  function toggleSign(){
    if (S.display === '0') return;
    S.eqText = null;
    S.display = S.display.startsWith('-') ? S.display.slice(1) : '-' + S.display;
    S.freshResult = false;
    render();
  }

  function percent(){
    const cur = toNumber(S.display);
    const before = group(S.display);
    S.eqText = null;
    let val;
    if ((S.op === 'add' || S.op === 'sub') && S.acc !== null) {
      val = S.acc * cur / 100;
    } else {
      val = cur / 100;
    }
    S.display = String(parseFloat(val.toPrecision(12)));
    S.pctLabel = before + '%';
    S.freshResult = true;   // show formatted result, but do not reset typing chain
    S.waiting = false;
    S.clearMode = true;
    render();
  }

  function compute(a, b, op){
    switch(op){
      case 'add': return a + b;
      case 'sub': return a - b;
      case 'mul': return a * b;
      case 'div': return b === 0 ? NaN : a / b;
    }
    return b;
  }

  function setOp(op){
    const cur = toNumber(S.display);
    S.eqText = null;
    S.pctLabel = null;

    if (S.op && S.waiting) {          // just switch operator
      S.op = op;
      S.tokens[S.tokens.length - 1] = OPS[op];
      render(); return;
    }

    if (S.acc === null) {
      S.acc = cur;
    } else if (S.op) {
      const r = compute(S.acc, cur, S.op);
      if (!isFinite(r)) { setError(); return; }
      S.acc = r;
      S.display = String(parseFloat(r.toPrecision(12)));
    } else {
      S.acc = cur;
    }

    S.op = op;
    S.waiting = true;
    S.freshResult = false;
    S.lastOp = null;   // new chain resets repeat
    S.clearMode = false;
    S.tokens = [fmt(S.acc), OPS[op]];
    render();
  }

  function equals(){
    let a, b, op, operandText;

    if (S.op !== null) {
      a = S.acc;
      b = toNumber(S.display);
      op = S.op;
      operandText = S.pctLabel ? S.pctLabel : fmt(b);
      S.acc = null;
    } else if (S.lastOp !== null) {
      // repeated equals: use previous result
      a = toNumber(S.display);
      b = S.lastOperand;
      op = S.lastOp;
      operandText = fmt(b);
    } else {
      S.freshResult = true;
      render();
      return;
    }

    const r = compute(a, b, op);
    if (!isFinite(r)) { setError(); return; }

    S.lastOp = op;
    S.lastOperand = b;
    S.display = String(parseFloat(r.toPrecision(12)));
    S.op = null;
    S.waiting = false;
    S.freshResult = true;
    S.clearMode = false;
    S.pctLabel = null;
    S.tokens = [];
    S.eqText = fmt(a) + ' ' + OPS[op] + ' ' + operandText + ' =';
    render();
  }

  function setError(){
    S.display = 'Error';
    displayEl.textContent = 'Error';
    S.acc = null; S.op = null; S.waiting = true; S.freshResult = true; S.lastOp = null;
    S.tokens = []; S.eqText = null; S.pctLabel = null;
  }

  function clear(){
    if (S.clearMode) {
      // C: clear current entry only
      S.display = '0';
      S.freshResult = false;
      S.waiting = false;
      S.clearMode = false;
    } else {
      // AC: clear everything
      S.display = '0';
      S.acc = null; S.op = null; S.waiting = false;
      S.lastOp = null; S.lastOperand = null;
      S.freshResult = false; S.clearMode = false;
    }
    S.tokens = [];
    S.eqText = null;
    S.pctLabel = null;
    render();
  }

  /* ---------- wiring ---------- */
  function press(key){
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch(e){} }
    if (/^[0-9]$/.test(key)) return inputDigit(key);
    switch(key){
      case 'dot': return inputDot();
      case 'ac': return clear();
      case 'sign': return toggleSign();
      case 'pct': return percent();
      case 'add': case 'sub': case 'mul': case 'div': return setOp(key);
      case 'eq': return equals();
    }
  }

  document.getElementById('keys').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]');
    if (b) press(b.dataset.k);
  });

  // keyboard support (desktop / bluetooth keyboard)
  addEventListener('keydown', e => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) return press(k);
    if (k === '.' || k === ',') return press('dot');
    if (k === '+') return press('add');
    if (k === '-') return press('sub');
    if (k === '*' || k === 'x') return press('mul');
    if (k === '/') return press('div');
    if (k === 'Enter' || k === '=') { e.preventDefault(); return press('eq'); }
    if (k === 'Escape') return press('ac');
    if (k === 'Backspace') {
      if (S.freshResult || S.waiting) return clear();
      S.display = S.display.length > 1 ? S.display.slice(0,-1) : '0';
      if (S.display === '-') S.display = '0';
      render();
    }
    if (k === '%') return press('pct');
  });

  addEventListener('resize', () => render());
  addEventListener('orientationchange', () => setTimeout(render, 120));

  render();
})();


</script>
</body>
</html>
